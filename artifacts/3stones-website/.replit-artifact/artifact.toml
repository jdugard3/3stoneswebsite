kind = "web"
previewPath = "/"
title = "3 Stones Services LLC"
version = "1.0.0"
id = "artifacts/3stones-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23211

[services.development]
run = "pnpm --filter @workspace/3stones-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/3stones-website", "run", "build" ]
publicDir = "artifacts/3stones-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23211"
BASE_PATH = "/"
